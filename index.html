<!DOCTYPE html>
<html lang="de">
<head>
    <!-- Meta Stuff und Title -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sehen wir uns in Farbe 🎃</title>

    <!-- Tailwind CSS und custom css -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">

    <!-- Google Fonts implementieren -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Henny+Penny&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

</head>
<body class="flex flex-col items-center justify-between min-h-screen relative p-4 md:p-8 select-none font-quicksand">

    <!-- Background glow -->
    <div class="bg-glow-container"></div>

    <!-- Sternenbild Background Castor und Pollux -->
    <svg class="constellation-overlay" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="bright-star-glow" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>

        <!-- Lines für Sternenbild -->
        <g stroke="#38bdf8" stroke-width="2" opacity="0.6">
            <!-- Castor -->
            <line x1="240" y1="210" x2="430" y2="285" />
            <line x1="430" y1="285" x2="570" y2="140" />
            <line x1="430" y1="285" x2="650" y2="480" />

            <!-- Pollux -->
            <line x1="140" y1="340" x2="230" y2="425" />
            <line x1="230" y1="425" x2="140" y2="490" />
            <line x1="230" y1="425" x2="430" y2="285" />
            <line x1="230" y1="425" x2="350" y2="590" />

            <!-- Links -->
            <line x1="350" y1="590" x2="350" y2="800" />
            <line x1="350" y1="800" x2="610" y2="940" />
            <line x1="350" y1="590" x2="490" y2="670" />
            <line x1="490" y1="670" x2="710" y2="810" />

            <!-- Rechts -->
            <line x1="650" y1="480" x2="770" y2="660" />
            <line x1="650" y1="480" x2="825" y2="580" />
            <line x1="825" y1="580" x2="890" y2="570" />
            <line x1="890" y1="570" x2="970" y2="530" />
        </g>

        <!-- Feste Sterne Background -->
        <circle cx="120" cy="80" r="2" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 2.5s;" />
        <circle cx="890" cy="150" r="2.5" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 3.2s;" />
        <circle cx="450" cy="100" r="1.5" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 4.1s;" />
        <circle cx="200" cy="300" r="3" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 2.8s;" />
        <circle cx="750" cy="350" r="2" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 3.6s;" />
        <circle cx="920" cy="500" r="2.2" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 2.4s;" />
        <circle cx="80" cy="600" r="2.8" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 3.9s;" />
        <circle cx="300" cy="750" r="1.8" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 2.7s;" />
        <circle cx="600" cy="850" r="2.5" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 3.3s;" />
        <circle cx="850" cy="900" r="3" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 2.1s;" />
        <circle cx="150" cy="920" r="2" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 4.5s;" />

        <!-- Sterne für Sternenbild -->
        <circle cx="570" cy="140" r="4" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 2.7s;" />
        <circle cx="430" cy="285" r="5" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 3.1s;" />
        <circle cx="230" cy="425" r="5" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 2.4s;" />
        <circle cx="140" cy="490" r="4" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 3.8s;" />
        <circle cx="350" cy="590" r="4.5" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 2.9s;" />
        <circle cx="350" cy="800" r="4.5" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 3.3s;" />
        <circle cx="610" cy="940" r="4" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 2.2s;" />
        <circle cx="490" cy="670" r="4" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 3.6s;" />
        <circle cx="710" cy="810" r="5" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 2.8s;" />
        <circle cx="650" cy="480" r="4.5" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 3.0s;" />
        <circle cx="770" cy="660" r="4" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 2.5s;" />
        <circle cx="825" cy="580" r="4" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 3.4s;" />
        <circle cx="890" cy="570" r="4" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 2.1s;" />
        <circle cx="970" cy="530" r="4" fill="#ffffff" class="twinkle-star" style="--twinkle-dur: 3.7s;" />

        <!-- Castor -->
        <g filter="url(#bright-star-glow)">
            <line x1="240" y1="192" x2="240" y2="228" stroke="#ffffff" stroke-width="2" />
            <line x1="222" y1="210" x2="258" y2="210" stroke="#ffffff" stroke-width="2" />
            <line x1="227" y1="197" x2="253" y2="223" stroke="#ffffff" stroke-width="1.5" />
            <line x1="227" y1="223" x2="253" y2="197" stroke="#ffffff" stroke-width="1.5" />
            <circle cx="240" cy="210" r="7" fill="#ffffff" />
            <text x="260" y="195" class="star-label">Castor</text>
        </g>

        <!-- Pollux -->
        <g filter="url(#bright-star-glow)">
            <line x1="140" y1="320" x2="140" y2="360" stroke="#ffffff" stroke-width="2" />
            <line x1="120" y1="340" x2="160" y2="340" stroke="#ffffff" stroke-width="2" />
            <line x1="126" y1="326" x2="154" y2="354" stroke="#ffffff" stroke-width="1.5" />
            <line x1="126" y1="354" x2="154" y2="326" stroke="#ffffff" stroke-width="1.5" />
            <circle cx="140" cy="340" r="8" fill="#ffffff" />
            <text x="70" y="315" class="star-label">Pollux</text>
        </g>
    </svg>

    <!-- Background Emojis flying animation -->
    <div id="emoji-background" class="fixed inset-0 pointer-events-none z-1 overflow-hidden"></div>

    <header class="z-10 w-full max-w-4xl py-1"></header>

    <main class="z-10 w-full max-w-4xl flex flex-col items-center text-center py-1 my-auto">
        <!-- Überschrift -->
        <div class="mb-2 -mt-4 sm:-mt-6 space-y-0.5 px-3">
            <h1 id="main-headline" class="font-henny-penny text-3xl sm:text-5xl md:text-7xl font-bold tracking-wide text-pumpkin-glow leading-tight">
                Bis wir uns wiedersehen
            </h1>
            <p id="sub-headline" class="font-henny-penny text-lg sm:text-2xl md:text-4xl text-orange-100/90 text-subtle-glow">
                sind es nur noch...
            </p>
        </div>

        <!-- Container für den countdown -->
        <div class="countdown-box w-full max-w-3xl p-6 sm:p-10 rounded-2xl my-2">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-6 sm:gap-8 w-full">
                <!-- Tage -->
                <div class="relative flex flex-col items-center justify-center pb-1">
                    <span id="days" class="font-creepster text-6xl sm:text-7xl md:text-8xl text-pumpkin-glow tracking-wider countdown-digit">00</span>
                    <span class="absolute bottom-2 inset-x-0 text-xs sm:text-sm font-bold tracking-[0.25em] text-orange-200/90 uppercase countdown-label pointer-events-none">TAGE</span>
                </div>

                <!-- Stuinden -->
                <div class="relative flex flex-col items-center justify-center pb-1">
                    <span id="hours" class="font-creepster text-6xl sm:text-7xl md:text-8xl text-pumpkin-glow tracking-wider countdown-digit">00</span>
                    <span class="absolute bottom-2 inset-x-0 text-xs sm:text-sm font-bold tracking-[0.25em] text-orange-200/90 uppercase countdown-label pointer-events-none">STUNDEN</span>
                </div>

                <!-- Minuten -->
                <div class="relative flex flex-col items-center justify-center pb-1">
                    <span id="minutes" class="font-creepster text-6xl sm:text-7xl md:text-8xl text-pumpkin-glow tracking-wider countdown-digit">00</span>
                    <span class="absolute bottom-2 inset-x-0 text-xs sm:text-sm font-bold tracking-[0.25em] text-orange-200/90 uppercase countdown-label pointer-events-none">MINUTEN</span>
                </div>

                <!-- Sekunden -->
                <div class="relative flex flex-col items-center justify-center pb-1 pulse-gentle">
                    <span id="seconds" class="font-creepster text-6xl sm:text-7xl md:text-8xl text-pumpkin-glow tracking-wider countdown-digit">00</span>
                    <span class="absolute bottom-2 inset-x-0 text-xs sm:text-sm font-bold tracking-[0.25em] text-orange-200/90 uppercase countdown-label pointer-events-none">SEKUNDEN</span>
                </div>
            </div>
        </div>

        <!-- PLATZHALTER-BUTTON -->
        <div class="mt-4 w-full flex justify-center">
            <button type="button" class="px-6 py-3 rounded-xl font-henny-penny text-lg sm:text-xl text-orange-200 bg-neutral-900/80 border border-orange-500/30 shadow-lg hover:border-orange-400 hover:text-white hover:scale-105 transition-all duration-300 flex items-center space-x-2">
                <span>🪐</span>
                <span>Knopfi ohne Funktion</span>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-solid z-10 w-full text-center py-3 px-4 text-orange-100/90 font-medium text-xs sm:text-sm space-y-1">
        <div id="footer-top" class="tracking-widest uppercase font-bold text-orange-200/90 flex items-center justify-center space-x-2">
            <span>🥰</span>
            <span>MAUSIII WIEDERSEHEN!</span>
        </div>
        <div id="footer-bottom">
            🕊️ Für mein Täubchen gemacht 🕊️
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
